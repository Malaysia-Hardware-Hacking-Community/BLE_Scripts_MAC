name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          # Confirm the toolkit works on the two platforms it targets. The test
          # suite uses fake clients, so it needs no Bluetooth hardware.
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  quality:
    name: quality (lint, dead code, duplication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Byte-compile every module
        run: python -m py_compile *.py BLE-Exploits/*.py
      - name: Lint (redundancy, simplifications, slow patterns, complexity)
        run: ruff check .
      - name: Formatter drift check
        run: ruff format --check .
      - name: Dead code
        run: vulture *.py BLE-Exploits/*.py --min-confidence 80
      - name: Duplicate logic
        run: >
          pylint --disable=all --enable=duplicate-code
          *.py BLE-Exploits/*.py
